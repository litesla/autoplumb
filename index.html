<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPlumb — Автотовари та Сантехніка в Україні</title>
    <meta name="description" content="Найкращий вибір автотоварів та сантехніки в Україні. Швидка доставка, гарантія якості та професійна підтримка." />
    <meta name="keywords" content="автотовари, сантехніка, купити автотовари, купити сантехніку, Україна, Нова Пошта" />
    <script>
      (function() {
        var suppressPattern = /Talisman extension|onboarding|configured yet|MetaMask|web3|ethereum|evm/i;

        // 1. Immediate console wrapper to silence extension logs
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            try {
              var args = Array.prototype.slice.call(arguments);
              var msg = args.map(function(a) {
                try {
                  return typeof a === 'object' ? JSON.stringify(a) : String(a);
                } catch(e) {
                  return String(a);
                }
              }).join(' ');
              if (suppressPattern.test(msg)) {
                return;
              }
            } catch(e) {}
            if (orig) {
              orig.apply(console, arguments);
            }
          };
        });

        // 2. Global error interceptors
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, colNo, error) {
          var errStr = [msg, url, error ? error.message : '', error ? error.stack : ''].join(' ');
          if (suppressPattern.test(errStr)) {
            return true;
          }
          if (prevOnError) {
            return prevOnError.apply(window, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          var msg = (e.message || (e.error && e.error.message) || '').toString();
          if (suppressPattern.test(msg)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || e.reason.stack || e.reason).toString() : '';
          if (suppressPattern.test(reason)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);

        // 3. Prevent postMessage noise from extensions
        window.addEventListener('message', function(e) {
          try {
            var dataStr = typeof e.data === 'string' ? e.data : JSON.stringify(e.data);
            if (suppressPattern.test(dataStr)) {
              e.stopImmediatePropagation();
            }
          } catch(err) {}
        }, true);

        // 4. CSS injection to hide any onboarding modals from extensions
        var injectStyles = function() {
          var style = document.createElement('style');
          style.id = 'suppress-crypto-styles';
          style.textContent = [
            '[id*="talisman"]', '[class*="talisman"]', '[id*="Talisman"]', '[class*="Talisman"]',
            '[id*="metamask"]', '[class*="metamask"]', '[id*="MetaMask"]', '[class*="MetaMask"]',
            '[id*="ethereum"]', '[class*="ethereum"]', '[id*="web3"]', '[class*="web3"]',
            'iframe[src*="talisman"]', 'div[style*="talisman"]',
            'iframe[src*="metamask"]', 'div[style*="metamask"]',
            '.talisman-onboarding', '#talisman-onboarding',
            '.metamask-onboarding', '#metamask-onboarding',
            '[data-talisman]', '[talisman-extension]',
            '[data-metamask]', '[metamask-extension]'
          ].join(', ') + ' { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important; position: absolute !important; left: -9999px !important; height: 0 !important; width: 0 !important; }';
          if (!document.getElementById('suppress-crypto-styles')) {
            (document.head || document.documentElement).appendChild(style);
          }
        };

        try {
          injectStyles();
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', injectStyles);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
